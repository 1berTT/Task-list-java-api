version: '3.8'
services:
  postgres:
    container_name: task_list_postgres
    image: postgres
    ports: 
      - 5432:5432
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=task_list
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d task_list"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: