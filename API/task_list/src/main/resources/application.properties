spring.application.name=task_list

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/task_list
spring.datasource.username=admin
spring.datasource.password=admin

# JPA/Hibernate Configuration - Desabilitar criação automática (Flyway gerencia)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Garantir que Flyway execute antes do JPA
spring.jpa.defer-datasource-initialization=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
# Logs do Flyway para debug
logging.level.org.flywaydb=INFO
logging.level.org.springframework.boot.autoconfigure.flyway=INFO

security.token.secret.admin=TASK_LIST_@JAVA#ADMIN
security.token.secret.user=TASK_LIST_@JAVA#USER
